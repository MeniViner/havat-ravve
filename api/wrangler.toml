# Havat Ravve API (stage 1: synthetic only). Deploys to <name>.<account>.workers.dev on the free plan.
# Secrets (never in this file or in git): `npx wrangler secret put API_CREDENTIALS` and `GCP_SERVICE_ACCOUNT`.
# Local values go in api/.dev.vars (git-ignored); see api/.dev.vars.example.
name = "havat-ravve-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
# Stage B: the separate Spark test project. The production project id is refused by the code.
FIRESTORE_PROJECT_ID = ""

[observability]
enabled = true
